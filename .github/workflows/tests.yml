name: Formula

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  serialterm:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: Homebrew/actions/setup-homebrew@0fdc2c96a16d9f945f7e1577784302fd27a549a9  # main, 2026-10-21

      # SwiftTerm needs Swift 6.2, so Sequoia users need Xcode 26 (or its Command Line Tools).
      - name: Select newest Xcode
        if: matrix.os == 'macos-15'
        run: |
          sudo xcode-select -s "$(printf "%s\n" /Applications/Xcode_*.app | sort -V | tail -1)"
          swift --version
          echo "Homebrew's SDK: $(brew ruby -e 'puts MacOS.sdk_path')"
          echo "Swift's SDK: $(xcrun --sdk macosx --show-sdk-path)"

      - run: brew style mousebrains/tap

      # Until SerialTerm has a tagged release, the formula only has a head version.
      - run: brew install --build-from-source --HEAD mousebrains/tap/serialterm

      - run: brew test mousebrains/tap/serialterm

      - run: brew audit --strict --formula mousebrains/tap/serialterm
